# =============================================================================
# Nyota OS — AI-Assisted System Diagnostics Configuration (Phase 19)
# =============================================================================

[diagnostics]
enabled=1
socket=/run/diag.sock
log_file=/var/log/diagnostics.log
telemetry_level=full

[ai]
enabled=1
provider=local
endpoint=http://10.0.2.2:11434/api/generate
model=nyota-diag
timeout_ms=5000
consent_required=1
redact_secrets=1
